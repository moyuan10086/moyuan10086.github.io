<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="600" viewBox="0 0 1410 600">
  <rect width="1410" height="600" fill="#f2ede4"/>
  <path d="M0 470H1410" stroke="#d8cfc3" stroke-width="3"/>

  <!-- Left: System A Rack (Global System) -->
  <g fill="none" stroke="#1f2429" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="280" y="190" width="220" height="280" rx="8" fill="#fbf9f5"/>
    <line x1="280" y1="250" x2="500" y2="250" stroke="#1f2429" stroke-width="4"/>
    <line x1="280" y1="310" x2="500" y2="310" stroke="#1f2429" stroke-width="4"/>
    <line x1="280" y1="370" x2="500" y2="370" stroke="#1f2429" stroke-width="4"/>
    <line x1="280" y1="430" x2="500" y2="430" stroke="#1f2429" stroke-width="4"/>
    <!-- Blade slots & LEDs -->
    <circle cx="320" cy="220" r="6" fill="#1f2429"/>
    <circle cx="340" cy="220" r="6" fill="#1f2429"/>
    <line x1="370" y1="220" x2="460" y2="220" stroke="#1f2429" stroke-width="5"/>
    
    <circle cx="320" cy="280" r="6" fill="#1f2429"/>
    <circle cx="340" cy="280" r="6" fill="#1f2429"/>
    <line x1="370" y1="280" x2="460" y2="280" stroke="#1f2429" stroke-width="5"/>

    <circle cx="320" cy="340" r="6" fill="#1f2429"/>
    <circle cx="340" cy="340" r="6" fill="#1f2429"/>
    <line x1="370" y1="340" x2="460" y2="340" stroke="#1f2429" stroke-width="5"/>

    <circle cx="320" cy="400" r="6" fill="#1f2429"/>
    <circle cx="340" cy="400" r="6" fill="#1f2429"/>
    <line x1="370" y1="400" x2="460" y2="400" stroke="#1f2429" stroke-width="5"/>
  </g>

  <!-- Center: Dual Circuit / Switch / Redundancy Bridge -->
  <g fill="none" stroke="#1f2429" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Breaker / Junction Box -->
    <rect x="635" y="270" width="140" height="140" rx="10" fill="#fbf9f5"/>
    <circle cx="705" cy="340" r="30" stroke="#1f2429" stroke-width="6"/>
  </g>
  <!-- Accent Toggle & Double Arcs -->
  <g fill="none" stroke="#a74635" stroke-width="7" stroke-linecap="round">
    <line x1="500" y1="340" x2="635" y2="340"/>
    <line x1="775" y1="340" x2="910" y2="340"/>
    <path d="M705 315v25l18 18"/>
    <circle cx="705" cy="340" r="8" fill="#a74635"/>
    <path d="M660 230c30-20 60-20 90 0M660 450c30 20 60 20 90 0" stroke-width="5" stroke-dasharray="12 8"/>
  </g>

  <!-- Right: System B Rack (Second System / Backup / Sovereign Stack) -->
  <g fill="none" stroke="#1f2429" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="910" y="190" width="220" height="280" rx="8" fill="#fbf9f5"/>
    <line x1="910" y1="250" x2="1130" y2="250" stroke="#1f2429" stroke-width="4"/>
    <line x1="910" y1="310" x2="1130" y2="310" stroke="#1f2429" stroke-width="4"/>
    <line x1="910" y1="370" x2="1130" y2="370" stroke="#1f2429" stroke-width="4"/>
    <line x1="910" y1="430" x2="1130" y2="430" stroke="#1f2429" stroke-width="4"/>
    <!-- Blade slots & LEDs -->
    <circle cx="950" cy="220" r="6" fill="#a74635"/>
    <circle cx="970" cy="220" r="6" fill="#a74635"/>
    <line x1="1000" y1="220" x2="1090" y2="220" stroke="#1f2429" stroke-width="5"/>
    
    <circle cx="950" cy="280" r="6" fill="#a74635"/>
    <circle cx="970" cy="280" r="6" fill="#a74635"/>
    <line x1="1000" y1="280" x2="1090" y2="280" stroke="#1f2429" stroke-width="5"/>

    <circle cx="950" cy="340" r="6" fill="#a74635"/>
    <circle cx="970" cy="340" r="6" fill="#a74635"/>
    <line x1="1000" y1="340" x2="1090" y2="340" stroke="#1f2429" stroke-width="5"/>

    <circle cx="950" cy="400" r="6" fill="#a74635"/>
    <circle cx="970" cy="400" r="6" fill="#a74635"/>
    <line x1="1000" y1="400" x2="1090" y2="400" stroke="#1f2429" stroke-width="5"/>
  </g>

  <!-- Accent sparks -->
  <g stroke="#a74635" stroke-width="4" stroke-linecap="round" opacity=".5">
    <line x1="200" y1="180" x2="250" y2="220"/>
    <line x1="1160" y1="180" x2="1210" y2="220"/>
  </g>
</svg>