<!DOCTYPE html>
<html lang="zh" class="no-js demo-1">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"> 
		<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
		<script src="js/jquery.min.js"></script>
		<script src="js/Helper.js"></script>
		<script src="js/keyboard.js"></script>
		<script src="js/const.js"></script>
		<script src="js/level.js"></script>
		<script src="js/crackAnimation.js"></script>
		<script src="js/prop.js"></script>
		<script src="js/bullet.js"></script>
		<script src="js/tank.js"></script>
		<script src="js/num.js"></script>
		<script src="js/menu.js"></script>
		<script src="js/map.js"></script>
		<script src="js/Collision.js"></script>
		<script src="js/stage.js"></script>
		<script src="js/main.js"></script>
		<link rel="stylesheet" type="text/css" href="css/default.css" />
		<style type="text/css">
			html,body{overflow:hidden;margin:0;padding:0;width:100%;height:100%;background:#000}
			.container{position:relative;width:100%;height:100%;overflow:hidden}
			.tank-help{display:none}
			.main{position:absolute;inset:0;display:grid;place-items:center;width:100%;height:100%;overflow:hidden}
			#canvasDiv{
				position:relative;
				width:512px;
				height:448px;
				background:#000;
			}
			#canvasDiv canvas{
				position:absolute;
				left:0;
				top:0;
				width:100%;
				height:100%;
				image-rendering: pixelated;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="tank-help">玩家1：WASD 移动，Space 射击；玩家2：方向键移动，Enter 射击；N/P 切换关卡。</div>
			<div class="main clearfix">
				<div id="canvasDiv" >
					<canvas id="wallCanvas" ></canvas> 
					<canvas id="tankCanvas" ></canvas>
					<canvas id="grassCanvas" ></canvas>
					<canvas id="overCanvas" ></canvas> 
					<canvas id="stageCanvas" ></canvas>
				</div>
			</div>
			
		</div><!-- /container -->
		<script>
			(function () {
				var BASE_W = 512;
				var BASE_H = 448;
				var canvasDiv = document.getElementById("canvasDiv");
				if (!canvasDiv) return;
				function fit() {
					var scale = Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H);
					canvasDiv.style.width = Math.floor(BASE_W * scale) + "px";
					canvasDiv.style.height = Math.floor(BASE_H * scale) + "px";
				}
				window.addEventListener("resize", fit);
				window.addEventListener("orientationchange", fit);
				fit();
			}());
		</script>

	</body>
</html>
