<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小鸟游六花主题俄罗斯方块</title>
  <script>
    if (new URLSearchParams(location.search).get("embed") === "board") {
      document.documentElement.classList.add("is-board-embed");
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=ZCOOL+KuaiLe&display=swap');

    :root {
      --ink: #201339;
      --violet: #7d5ee6;
      --violet-2: #b497ff;
      --cyan: #52d6f2;
      --rose: #ff87bb;
      --gold: #ffd76d;
      --paper: rgba(255, 255, 255, 0.78);
      --line: rgba(111, 82, 190, 0.18);
      --shadow: 0 24px 70px rgba(74, 50, 138, 0.2);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: var(--ink);
      font-family: "ZCOOL KuaiLe", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 12% 28%, rgba(255, 215, 109, 0.3), transparent 16%),
        radial-gradient(circle at 84% 22%, rgba(82, 214, 242, 0.22), transparent 22%),
        linear-gradient(135deg, #f7f3ff 0%, #eef5ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
    }

    body::before {
      background-image:
        linear-gradient(rgba(125, 94, 230, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(125, 94, 230, 0.08) 1px, transparent 1px);
      background-size: 34px 34px;
      transform: rotate(-7deg);
      opacity: 0.65;
    }

    body::after {
      background:
        radial-gradient(circle at 12% 76%, rgba(125, 94, 230, 0.12) 0 11px, transparent 12px),
        radial-gradient(circle at 91% 72%, rgba(255, 135, 187, 0.13) 0 13px, transparent 14px),
        radial-gradient(circle at 70% 89%, rgba(82, 214, 242, 0.15) 0 8px, transparent 9px);
    }

    button,
    select {
      font: inherit;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1500px, 100vw);
      height: min(900px, 100vh);
      margin: 0;
      display: grid;
      grid-template-columns: clamp(230px, 24vw, 330px) minmax(360px, 1fr) clamp(210px, 20vw, 280px);
      gap: 14px;
      align-items: stretch;
      flex: 0 0 auto;
      transform-origin: center center;
      padding: 14px;
      border: 1px solid rgba(78, 64, 126, 0.24);
      border-radius: 14px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.68), rgba(236,230,255,0.7)),
        linear-gradient(rgba(125, 94, 230, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(125, 94, 230, 0.08) 1px, transparent 1px);
      background-size: auto, 34px 34px, 34px 34px;
      box-shadow: 0 24px 70px rgba(74, 90, 150, 0.18);
    }

    .panel,
    .board-shell {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.7);
      box-shadow: none;
      backdrop-filter: blur(18px);
      border-radius: 8px;
    }

    .panel {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      position: relative;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, rgba(255,255,255,0.62), transparent 42%);
      pointer-events: none;
    }

    .brand {
      position: relative;
      min-height: 128px;
      border-radius: 8px;
      padding: 15px 13px;
      color: #fff;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(17, 10, 37, 0.9) 0%, rgba(40, 23, 76, 0.72) 45%, rgba(30, 19, 67, 0.18) 100%),
        linear-gradient(180deg, rgba(10, 6, 24, 0.08), rgba(10, 6, 24, 0.52)),
        url('assets/rikka-character.png') 74% 18% / auto 192px no-repeat;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.16),
        0 12px 24px rgba(62, 44, 132, 0.15);
    }

    .brand::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(21, 9, 43, 0.35), transparent 72%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.08) 0 1px, transparent 1px 18px);
      mix-blend-mode: screen;
      opacity: 0.42;
      pointer-events: none;
    }

    .brand::after {
      content: "邪王真眼";
      position: absolute;
      right: 11px;
      top: 12px;
      color: rgba(255,255,255,0.76);
      font-size: 12px;
      letter-spacing: 0.18em;
      writing-mode: vertical-rl;
      text-shadow: 0 2px 10px rgba(19, 8, 42, 0.75);
    }

    .kicker,
    .label {
      color: rgba(50, 33, 85, 0.54);
      font-family: Orbitron, sans-serif;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .brand .kicker {
      position: relative;
      z-index: 1;
      color: rgba(255,255,255,0.72);
      text-shadow: 0 1px 8px rgba(10, 5, 28, 0.72);
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 8px 0 0;
      width: 132px;
      font-size: 28px;
      line-height: 1.04;
      letter-spacing: 0;
      text-shadow: 0 2px 14px rgba(8, 4, 21, 0.72);
    }

    .quote {
      position: relative;
      z-index: 1;
      margin: 7px 0 0;
      width: 124px;
      color: rgba(255,255,255,0.84);
      font-size: 12px;
      line-height: 1.48;
      text-shadow: 0 1px 8px rgba(8, 4, 21, 0.8);
    }

    .rikka-card {
      position: relative;
      flex: 1 1 240px;
      min-height: 220px;
      border: 1px solid rgba(125, 94, 230, 0.18);
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.82) 88%),
        radial-gradient(circle at 18% 18%, rgba(125, 94, 230, 0.24), transparent 32%),
        url('assets/rikka-character.png') 50% 10% / auto 118% no-repeat;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);
    }

    .rikka-card::before {
      content: "JAO SHINGAN";
      position: absolute;
      left: 15px;
      top: 12px;
      color: rgba(255,255,255,0.76);
      font-family: Orbitron, sans-serif;
      font-size: 10px;
      letter-spacing: 0.12em;
      z-index: 2;
    }

    .rikka-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 86% 18%, rgba(255, 215, 109, 0.72) 0 8px, transparent 9px),
        linear-gradient(180deg, transparent 0 54%, rgba(255,255,255,0.92) 100%);
      pointer-events: none;
    }

    .rikka-figure {
      display: none;
    }

    .rikka-hair {
      position: absolute;
      left: 18px;
      top: 8px;
      width: 68px;
      height: 74px;
      border-radius: 47% 53% 46% 54%;
      background: #241a45;
      box-shadow:
        -13px 18px 0 -5px #241a45,
        15px 16px 0 -6px #2d2254;
    }

    .rikka-bow {
      position: absolute;
      right: 3px;
      top: 18px;
      width: 28px;
      height: 20px;
      background:
        radial-gradient(circle at center, #ffe28a 0 4px, transparent 5px),
        linear-gradient(35deg, transparent 0 31%, #ffd76d 32% 68%, transparent 69%),
        linear-gradient(-35deg, transparent 0 31%, #ffd76d 32% 68%, transparent 69%);
      transform: rotate(16deg);
    }

    .rikka-face {
      position: absolute;
      left: 28px;
      top: 32px;
      width: 50px;
      height: 55px;
      border-radius: 46% 46% 48% 48%;
      background: #ffe8df;
      box-shadow: inset -5px -7px 0 rgba(220, 138, 172, 0.18);
    }

    .rikka-face::before {
      content: "";
      position: absolute;
      left: 9px;
      top: 18px;
      width: 10px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 62% 34%, #fff 0 2px, #46cde6 3px 5px, #173a63 6px);
    }

    .rikka-face::after {
      content: "";
      position: absolute;
      right: 8px;
      top: 12px;
      width: 17px;
      height: 22px;
      border-radius: 50%;
      background:
        linear-gradient(118deg, transparent 0 39%, rgba(255,255,255,0.92) 40% 52%, transparent 53%),
        #f7f2ff;
      border: 2px solid #7d5ee6;
      box-shadow: 0 0 0 2px rgba(125,94,230,0.12);
    }

    .rikka-body {
      position: absolute;
      left: 16px;
      top: 82px;
      width: 74px;
      height: 62px;
      border-radius: 20px 20px 12px 12px;
      background: linear-gradient(135deg, #3f276c, #6b4bda);
      transform: perspective(80px) rotateX(5deg);
    }

    .rikka-body::before {
      content: "GO";
      position: absolute;
      left: 22px;
      top: 17px;
      color: rgba(255,255,255,0.88);
      font-family: Orbitron, sans-serif;
      font-size: 17px;
      font-weight: 900;
    }

    .rikka-speech {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      z-index: 2;
      padding: 10px 12px;
      border: 1px solid rgba(125, 94, 230, 0.22);
      border-radius: 16px 16px 16px 4px;
      color: #6b4bda;
      background: rgba(255,255,255,0.82);
      font-size: 13px;
      line-height: 1.4;
      font-weight: 900;
      text-shadow: none;
    }

    .control-row,
    .touch-row {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn,
    .select {
      position: relative;
      height: 36px;
      border: 1px solid rgba(125, 94, 230, 0.26);
      border-radius: 8px;
      color: #352358;
      background: rgba(255,255,255,0.64);
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(92, 64, 170, 0.18);
    }

    .btn.primary {
      color: #fff;
      border-color: rgba(125, 94, 230, 0.4);
      background: linear-gradient(135deg, #6b4bda, #cf6ad1);
    }

    .select {
      width: 100%;
      padding: 0 12px;
      appearance: none;
      outline: 0;
    }

    .stats {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .stat {
      border: 1px solid rgba(125, 94, 230, 0.16);
      border-radius: 8px;
      padding: 7px 10px;
      background: rgba(255,255,255,0.52);
    }

    .stat strong {
      display: block;
      margin-top: 4px;
      color: #3c236e;
      font-family: Orbitron, monospace;
      font-size: 20px;
      line-height: 1;
    }

    .keys {
      position: relative;
      display: grid;
      gap: 5px;
      margin-top: 0;
      flex: 0 0 auto;
    }

    .key {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(125, 94, 230, 0.2);
      padding-bottom: 4px;
      font-size: 11px;
      line-height: 1.15;
      color: rgba(50, 33, 85, 0.72);
    }

    .key span:first-child {
      min-width: 42px;
      color: #6b4bda;
      font-family: Orbitron, sans-serif;
      font-size: 11px;
    }

    .board-shell {
      position: relative;
      display: grid;
      place-items: center;
      padding: 22px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.82), rgba(240,235,255,0.72)),
        radial-gradient(circle at 15% 12%, rgba(82, 214, 242, 0.2), transparent 28%);
    }

    .board-top {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(50, 33, 85, 0.66);
      font-family: Orbitron, sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    .board-wrap {
      position: relative;
      width: min(100%, 480px);
      aspect-ratio: 10 / 20;
      max-height: calc(100% - 36px);
      margin-top: 28px;
      border: 3px solid rgba(77, 45, 132, 0.24);
      border-radius: 8px;
      background: #170d2a;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.1),
        0 20px 40px rgba(55, 35, 104, 0.22);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #effects {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .line-flash {
      position: absolute;
      left: 0;
      right: 0;
      height: 5%;
      background: linear-gradient(90deg, transparent, rgba(255, 215, 109, 0.85), transparent);
      animation: clearFlash 360ms ease-out forwards;
    }

    @keyframes clearFlash {
      from { opacity: 1; transform: scaleX(0.2); }
      to { opacity: 0; transform: scaleX(1); }
    }

    .center-message {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(24, 13, 42, 0.72);
      color: #fff;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .center-message.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .center-message h2 {
      margin: 0 0 8px;
      font-size: 34px;
      letter-spacing: 0;
    }

    .center-message p {
      margin: 0 0 18px;
      color: rgba(255,255,255,0.78);
      font-size: 14px;
      line-height: 1.6;
    }

    .next-box,
    .hold-box {
      position: relative;
      height: 128px;
      border: 1px solid rgba(125, 94, 230, 0.16);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(42, 23, 77, 0.9), rgba(79, 57, 150, 0.82));
      overflow: hidden;
    }

    .next-box canvas,
    .hold-box canvas {
      width: 100%;
      height: 100%;
    }

    .combo {
      position: relative;
      padding: 16px;
      border-radius: 8px;
      color: #fff;
      background:
        radial-gradient(circle at 88% 22%, rgba(255, 215, 109, 0.9) 0 8px, transparent 9px),
        linear-gradient(135deg, #2d174f, #6f5de8);
      min-height: 108px;
    }

    .combo strong {
      display: block;
      margin-top: 5px;
      font-family: Orbitron, sans-serif;
      font-size: 25px;
    }

    .touch-pad {
      position: relative;
      display: grid;
      gap: 8px;
      margin-top: auto;
    }

    .touch-row.three {
      grid-template-columns: repeat(3, 1fr);
    }

    .touch {
      height: 40px;
      border: 1px solid rgba(125, 94, 230, 0.22);
      border-radius: 8px;
      color: #4c2a80;
      background: rgba(255,255,255,0.58);
      cursor: pointer;
      user-select: none;
    }

    .touch.wide {
      grid-column: span 2;
      color: #fff;
      background: linear-gradient(135deg, #5840c3, #52c8dd);
    }

    @media (max-height: 520px) {
      .touch { height: 38px; }
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: minmax(170px, 0.72fr) minmax(330px, 1.4fr) minmax(150px, 0.62fr);
        gap: 10px;
        padding: 10px;
      }
      .brand {
        min-height: 116px;
      }
      .rikka-card {
        min-height: 260px;
        background-size: auto 110%;
      }
      .keys {
        display: none;
      }
      .board-wrap {
        width: min(100%, 430px);
      }
      .next-box,
      .hold-box {
        height: 104px;
      }
    }

    .is-board-embed,
    .is-board-embed body {
      overflow: hidden;
      background: transparent;
    }

    .is-board-embed body::before,
    .is-board-embed body::after {
      display: none;
    }

    .is-board-embed .app {
      width: 100vw;
      height: 100vh;
      grid-template-columns: 1fr;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      transform: none !important;
    }

    .is-board-embed .panel {
      display: none;
    }

    .is-board-embed .board-shell {
      border: 0;
      border-radius: 0;
      padding: 18px;
      background:
        radial-gradient(circle at 18% 12%, rgba(154, 115, 238, 0.18), transparent 30%),
        linear-gradient(180deg, rgba(255,255,255,0.78), rgba(247,243,255,0.68));
      backdrop-filter: none;
    }

    .is-board-embed .board-top {
      left: 26px;
      right: 26px;
      top: 16px;
    }

    .is-board-embed .board-wrap {
      width: min(calc((100vh - 74px) * 0.5), calc(100vw - 72px), 560px);
      max-height: calc(100vh - 74px);
      margin-top: 34px;
      border-color: rgba(77, 45, 132, 0.28);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.1),
        0 22px 42px rgba(72, 48, 130, 0.2);
    }
  </style>
</head>
<body>
  <main class="app" aria-label="小鸟游六花主题俄罗斯方块">
    <aside class="panel">
      <section class="brand">
        <div class="kicker">Rikka Block Protocol</div>
        <h1>六花方块</h1>
        <p class="quote">爆裂现实，填满消行。和邪王真眼一起守住这块 10×20 的战场。</p>
      </section>

      <div>
        <div class="label" style="margin-bottom: 6px;">Difficulty</div>
        <select id="difficulty" class="select" aria-label="难度">
          <option value="relaxed">普通模式</option>
          <option value="standard" selected>契约模式</option>
          <option value="chaos">不可视境界线</option>
        </select>
      </div>

      <div class="control-row">
        <button class="btn primary" id="restart" type="button">重新开始</button>
        <button class="btn" id="pause" type="button">暂停</button>
      </div>

      <section class="rikka-card" aria-label="小鸟游六花角色面板">
        <div class="rikka-speech">契约者，别让方块越过境界线。</div>
        <div class="rikka-figure" aria-hidden="true">
          <div class="rikka-hair"></div>
          <div class="rikka-bow"></div>
          <div class="rikka-face"></div>
          <div class="rikka-body"></div>
        </div>
      </section>

      <section class="stats" aria-label="游戏数据">
        <div class="stat"><span class="label">Score</span><strong id="score">0</strong></div>
        <div class="stat"><span class="label">Best</span><strong id="best">0</strong></div>
        <div class="stat"><span class="label">Lines</span><strong id="lines">0</strong></div>
        <div class="stat"><span class="label">Level</span><strong id="level">1</strong></div>
      </section>

      <section class="keys" aria-label="键盘说明">
        <div class="key"><span>← →</span><b>左右移动</b></div>
        <div class="key"><span>↑ / X</span><b>旋转</b></div>
        <div class="key"><span>↓</span><b>软降</b></div>
        <div class="key"><span>Space</span><b>硬降</b></div>
        <div class="key"><span>C</span><b>暂存</b></div>
        <div class="key"><span>P</span><b>暂停</b></div>
      </section>
    </aside>

    <section class="board-shell">
      <div class="board-top">
        <span>Jao Shingan Field</span>
        <span id="status">READY</span>
      </div>
      <div class="board-wrap">
        <canvas id="board" width="300" height="600" aria-label="俄罗斯方块棋盘"></canvas>
        <div id="effects"></div>
        <div class="center-message is-visible" id="message">
          <div>
            <h2>契约开始</h2>
            <p>按方向键移动，空格落底。手机上可以用右侧按钮。</p>
            <button class="btn primary" id="start" type="button">开始游戏</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div>
        <div class="label" style="margin-bottom: 6px;">Next</div>
        <div class="next-box"><canvas id="next" width="184" height="118"></canvas></div>
      </div>

      <div>
        <div class="label" style="margin-bottom: 6px;">Hold</div>
        <div class="hold-box"><canvas id="hold" width="184" height="118"></canvas></div>
      </div>

      <div class="combo">
        <span class="label" style="color:rgba(255,255,255,0.62)">Combo</span>
        <strong id="combo">0</strong>
        <small>连续消行计数，分数按经典清行档位计算</small>
      </div>

      <section class="touch-pad" aria-label="触摸操作">
        <div class="touch-row three">
          <button class="touch" data-action="left" type="button">←</button>
          <button class="touch" data-action="rotate" type="button">⟳</button>
          <button class="touch" data-action="right" type="button">→</button>
        </div>
        <div class="touch-row">
          <button class="touch" data-action="down" type="button">↓</button>
          <button class="touch" data-action="hold" type="button">Hold</button>
        </div>
        <div class="touch-row">
          <button class="touch wide" data-action="drop" type="button">Hard Drop</button>
        </div>
      </section>
    </aside>
  </main>

  <script src="js/index.js?v=rika-refactor-1"></script>
  <script>
    (function () {
      if (document.documentElement.classList.contains("is-board-embed")) return;
      var app = document.querySelector(".app");
      if (!app) return;
      function fit() {
        var scale = Math.min(window.innerWidth / 1500, window.innerHeight / 900, 1);
        app.style.transform = "scale(" + scale + ")";
      }
      window.addEventListener("resize", fit);
      fit();
      setTimeout(fit, 100);
    }());
  </script>
</body>
</html>
