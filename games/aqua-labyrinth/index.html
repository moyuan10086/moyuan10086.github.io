<!DOCTYPE html>
<html class="SG-game-show">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>一笔连珠</title>
<style>
*{padding:0;margin:0;cursor:default}
html,body{width:100%;height:100%;overflow:hidden;font:12px/20px sans-serif;background:#e8eef7}
</style>
</head>
<body class="game-show">
<script src="./Aqua+Labyrinth_files/game_min.js"></script>
<script>
// Ensure game initializes even if window.onload already fired or LOGO image fails
(function() {
  var _called = false;
  var _origParse = null;
  var check = setInterval(function() {
    if (!window.System || !window.construct) return;
    if (!_origParse) _origParse = window.System.parse;
    // Override parse to prevent double-call
    window.System.parse = function(c) {
      if (_called) return;
      _called = true;
      clearInterval(check);
      _origParse.call(window.System, c);
    };
  }, 100);
})();
</script>
</body>
</html>
