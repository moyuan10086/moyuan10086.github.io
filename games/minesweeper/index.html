<!DOCTYPE HTML>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
	<title>扫雷</title>
	<script src="js/jquery.min.js"></script>
<style>
	html,body{
		height:100%;
		margin:0;
		padding:0;
		overflow:hidden;
		background:#1a3a1a;
		display:flex;
		align-items:center;
		justify-content:center;
	}
	.game-wrapper {
		position:relative;
		transform-origin:center center;
	}
	.box{
		transform:perspective(1200px) rotatex(28deg);
		width:500px;
		height:500px;
		margin:0 auto;
		border-top:1px solid #B25F27;
		border-left:1px solid #B25F27;
		box-shadow:5px 5px 5px rgba(0,0,0,0.3);
	}
	.block{
		width:49px;
		height:49px;
		border-right:1px solid #B25F27;
		border-bottom:1px solid #B25F27;
		float:left;
		box-shadow:0 0 4px #333 inset;
		background:url(img/cao.jpg);
	}
	.show{
		background:url(img/dilei.jpg) no-repeat;
	}
	.num{
		background:#ECD0A1;
		font-size:18px;
		font-weight:bold;
		text-align:center;
		line-height:49px;
	}
	.time{
		width:50px;
		height:50px;
		border:1px solid red;
		text-align:center;
		line-height:50px;
		font-size:20px;
		font-weight:bold;
		position:absolute;
		right:10px;
		top:8px;
		background:url(img/shizhong.jpg) no-repeat;
		color:#fff;
		z-index:1;
	}
	.flagbox{
		width:40px;
		height:40px;
		padding:5px;
		background:url(img/hongqi.jpg) no-repeat;
		border:1px solid red;
		position:absolute;
		right:10px;
		top:70px;
		text-align:center;
		line-height:50px;
		font-size:20px;
		font-weight:bold;
		z-index:1;
	}
	.flag{
		background:url(img/hongqi.jpg) no-repeat;
	}
	.restart-link {
		text-align:center;
		margin-top:6px;
	}
	.restart-link a {
		color:#ffd700;
		font-size:13px;
		text-decoration:none;
		font-weight:bold;
	}
</style>
<script>
	$(function(){
		var $box = $(".box");
		var $flagbox = $(".flagbox");
		var $time = $(".time");
		var timer;

		function initGame() {
			$box.empty();
			$flagbox.text("10");
			$time.text("100");
			clearInterval(timer);
			do {
				$box.empty();
				for(var i=0;i<10;i++){
					for(var j=0;j<10;j++){
						var islei=Math.random()>0.9;
						$("<div></div>").addClass(function(){
							return "block"+(islei? " lei":"");
						}).data("pos",{x:i,y:j}).attr("id",i+"-"+j).mousedown(mousedownhandler).appendTo($box);
					}
				}
			} while($(".lei").length!=10);
			startTimer();
		}

		$(document).on("contextmenu",false);

		function startTimer() {
			clearInterval(timer);
			timer = setInterval(function(){
				var n = parseInt($time.text()) - 1;
				$time.text(n);
				if(n <= 0){
					clearInterval(timer);
					alert("时间到，游戏结束！");
				}
			},1000);
		}

		function mousedownhandler(e){
			e.preventDefault();
			if(e.which==1) leftclick.call(this);
			else if(e.which==3) rightclick.call(this);
		}

		function leftclick(){
			if($(this).hasClass("flag")) return;
			if($(this).hasClass("lei")){
				alert("你踩到地雷了!");
				clearInterval(timer);
				$(".lei").addClass("show");
			} else {
				var n=0;
				var pos=$(this).data("pos");
				$(this).addClass("num");
				for(var i=pos.x-1;i<=pos.x+1;i++){
					for(var j=pos.y-1;j<=pos.y+1;j++){
						if($("#"+i+"-"+j).hasClass("lei")) n++;
					}
				}
				$(this).text(n||"");
				if(n==0){
					for(var i=pos.x-1;i<=pos.x+1;i++){
						for(var j=pos.y-1;j<=pos.y+1;j++){
							if($("#"+i+"-"+j).length!=0){
								if(!$("#"+i+"-"+j).data("check")){
									$("#"+i+"-"+j).data("check",true);
									leftclick.call($("#"+i+"-"+j)[0]);
								}
							}
						}
					}
				}
			}
		}

		function rightclick(){
			if($(this).hasClass("num")) return;
			if($(this).hasClass("flag")){
				$flagbox.text(function(index,num){ return parseInt(num)+1; });
			} else {
				if($(".flag").length==10) return;
				$flagbox.text(function(index,num){ return parseInt(num)-1; });
			}
			$(this).toggleClass("flag");
			if($(".flag").filter(".lei").length==10){
				clearInterval(timer);
				alert("Success!");
			}
		}

		// Scale to fit container
		function scaleGame() {
			var wrap = document.querySelector('.game-wrapper');
			if (!wrap) return;
			var maxW = window.innerWidth;
			var maxH = window.innerHeight;
			var scale = Math.min(maxW / 520, maxH / 580, 1);
			wrap.style.transform = 'scale(' + scale + ')';
		}
		window.addEventListener('resize', scaleGame);

		initGame();
		scaleGame();
	});
</script>
</head>
<body>
<div class="game-wrapper">
	<div class="box"></div>
	<div class="flagbox">10</div>
	<div class="time">100</div>
	<div class="restart-link"><a href="javascript:location.reload()">重新开始</a></div>
</div>
</body>
</html>
