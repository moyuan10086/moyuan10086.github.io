<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一个都不能死</title>

<style type="text/css">
html, body {
	margin: 0;
	padding: 0;
	overflow: hidden;
	width: 100%;
	height: 100%;
	background: #000;
}
.game-stage {
	width: 100%;
	height: 100%;
	display: flex;
	align-items: center;
	justify-content: center;
}
.game-stage canvas {
	display: block;
	transform-origin: center center;
}
</style>

<script type="text/javascript" src="js/require.js"></script>
<script type="text/javascript" src="js/main.js"></script>

</head>
<body>

<div class="game-stage">
	<canvas id="linkScreen" width="1366" height="621">
		很遗憾，您的浏览器不支持HTML5，请使用支持HTML5的浏览器。
	</canvas>
</div>

<script>
// Scale canvas to fit viewport when window is smaller than native size.
// Does NOT touch canvas.width/height (buffer), so no flicker.
(function() {
	var NATIVE_W = 1366;
	var NATIVE_H = 621;

	function scaleCanvas() {
		var c = document.getElementById('linkScreen');
		if (!c) return;
		var vw = window.innerWidth;
		var vh = window.innerHeight;
		var scale = Math.min(vw / NATIVE_W, vh / NATIVE_H, 1);
		c.style.transform = 'scale(' + scale + ')';
		// Reset inline width/height so transform scaling is correct
		c.style.width = NATIVE_W + 'px';
		c.style.height = NATIVE_H + 'px';
	}

	scaleCanvas();
	window.addEventListener('resize', scaleCanvas);

	// Re-apply after game engine init (fire-and-forget timeouts)
	[300, 800, 1500, 3000].forEach(function(d) {
		setTimeout(scaleCanvas, d);
	});
})();
</script>

</body>
</html>
