<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一个都不能死</title>

<style type="text/css">
html, body {
	margin: 0;
	padding: 0;
	overflow: hidden;
	width: 100%;
	height: 100%;
	background: #000;
	display: flex;
	align-items: center;
	justify-content: center;
}
.game-stage {
	position: relative;
	width: 100%;
	height: 100%;
	max-width: 100vw;
	max-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	overflow: hidden;
}
.game-stage canvas {
	display: block;
	max-width: 100%;
	max-height: 100%;
	aspect-ratio: 1366 / 621;
}
</style>

<script type="text/javascript" src="js/require.js"></script>
<script type="text/javascript" src="js/main.js"></script>

</head>
<body>

<div class="game-stage">
	<canvas id="linkScreen" width="1366" height="621">
		很遗憾，您的浏览器不支持HTML5，请使用支持HTML5的浏览器。
	</canvas>
</div>

<script>
// Fix canvas dimensions for dual-lane rendering (needs ≥640px height)
// Game loads async via require.js and overwrites canvas dimensions during
// init. We poll aggressively at first, then keep a slow background guard.
(function() {
	var MIN_H = 640;
	var RATIO = 1366 / 621;

	function fixCanvas() {
		var c = document.getElementById('linkScreen');
		if (!c || !c.getContext) return;
		// Always set buffer to correct native size
		c.width = Math.floor(MIN_H * RATIO);
		c.height = MIN_H;
		// Scale display to fit available space while preserving ratio
		var vw = window.innerWidth;
		var vh = window.innerHeight;
		var dw = c.width;
		var dh = c.height;
		if (dw > vw) { dw = vw; dh = Math.floor(dw / RATIO); }
		if (dh > vh) { dh = vh; dw = Math.floor(dh * RATIO); }
		c.style.width = dw + 'px';
		c.style.height = dh + 'px';
	}

	// Phase 1: aggressive polling every 100ms for 10 seconds
	var count = 0;
	var fastId = setInterval(function() {
		fixCanvas();
		count++;
		if (count >= 100) { clearInterval(fastId); }
	}, 100);

	// Phase 2: slow background guard forever
	var slowId = setInterval(fixCanvas, 2000);

	// Also catch real browser resize events
	window.addEventListener('resize', function() {
		fixCanvas();
	});
})();
</script>

</body>
</html>
