<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一个都不能死</title>

<style type="text/css">
html, body {
	margin: 0;
	padding: 0;
	overflow: hidden;
	width: 100%;
	height: 100%;
	background: #000;
	display: flex;
	align-items: center;
	justify-content: center;
}
.game-stage {
	position: relative;
	width: 100%;
	height: 100%;
	max-width: 100vw;
	max-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	overflow: hidden;
}
.game-stage canvas {
	display: block;
	max-width: 100%;
	max-height: 100%;
	aspect-ratio: 1366 / 621;
}
</style>

<script type="text/javascript" src="js/require.js"></script>
<script type="text/javascript" src="js/main.js"></script>

</head>
<body>

<div class="game-stage">
	<canvas id="linkScreen" width="1366" height="621">
		很遗憾，您的浏览器不支持HTML5，请使用支持HTML5的浏览器。
	</canvas>
</div>

<script>
// Fix canvas dimensions for dual-lane rendering (needs ≥640px height)
// Game loads async via require.js + image pre-load, then overwrites canvas
// via window.onresize(). We intercept onresize + poll aggressively to undo it.
(function() {
	var minH = 640;
	var ratio = 1366 / 621;
	var fixTimer = null;

	function fixCanvas() {
		var c = document.getElementById('linkScreen');
		if (!c || !c.getContext) return;
		var currentRatio = c.width / c.height;
		if (Math.abs(currentRatio - ratio) < 0.01 && c.height >= minH) return; // already good
		var w = Math.max(c.width, Math.floor(minH * ratio));
		var h = Math.max(c.height, minH);
		if (w / h > ratio) w = Math.floor(h * ratio);
		else h = Math.floor(w / ratio);
		if (h < minH) { h = minH; w = Math.floor(h * ratio); }
		c.width = w;
		c.height = h;
		c.style.width = w + 'px';
		c.style.height = h + 'px';
	}

	// Intercept window.onresize assignments: game engine's handler fires first,
	// then we immediately correct the canvas back.
	var _origResize = null;
	Object.defineProperty(window, 'onresize', {
		configurable: true,
		enumerable: true,
		get: function() { return _origResize; },
		set: function(fn) {
			_origResize = function() {
				if (fn) fn.apply(this, arguments);
				clearTimeout(fixTimer);
				fixTimer = setTimeout(fixCanvas, 0);
			};
		}
	});
	// Save handle in case game engine already set onresize before our interceptor
	var _saved = window.onresize;
	window.onresize = _saved;

	// Poll aggressively while game is loading, then slowly in background
	var fastCount = 0;
	function poll() {
		fixCanvas();
		fastCount++;
		if (fastCount < 15) setTimeout(poll, 200);
	}

	// Phase 1: fast polling during game load (3 seconds)
	setTimeout(poll, 200);

	// Phase 2: slow background guard + catch real browser resize
	window.addEventListener('resize', function() {
		clearTimeout(fixTimer);
		fixTimer = setTimeout(fixCanvas, 100);
	});
	setInterval(fixCanvas, 2000);
})();
</script>

</body>
</html>
