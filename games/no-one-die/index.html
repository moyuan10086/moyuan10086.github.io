<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一个都不能死</title>

<style type="text/css">
html, body {
	margin: 0;
	padding: 0;
	overflow: hidden;
	width: 100%;
	height: 100%;
	background: #000;
	display: flex;
	align-items: center;
	justify-content: center;
}
.game-stage {
	position: relative;
	width: 100%;
	height: 100%;
	max-width: 100vw;
	max-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	overflow: hidden;
}
.game-stage canvas {
	display: block;
}
</style>

<script type="text/javascript" src="js/require.js"></script>
<script type="text/javascript" src="js/main.js"></script>

</head>
<body>

<div class="game-stage">
	<canvas id="linkScreen" width="1366" height="621">
		很遗憾，您的浏览器不支持HTML5，请使用支持HTML5的浏览器。
	</canvas>
</div>

<script>
// Fix canvas dimensions for dual-lane rendering (needs ≥640px height)
// Game loads async via require.js + image preload, so we poll until ready
(function() {
	var minH = 640;
	var ratio = 1366 / 621;
	var attempts = 0;
	var maxAttempts = 30;

	function fixCanvas() {
		var c = document.getElementById('linkScreen');
		if (!c || !c.getContext) return false;

		// 1. Set buffer dimensions for proper dual-lane rendering
		c.width = Math.floor(minH * ratio);
		c.height = minH;

		// 2. Compute display size that fits within viewport while preserving ratio
		var vw = window.innerWidth;
		var vh = window.innerHeight;
		var dw = c.width;
		var dh = c.height;
		if (dw > vw) { dw = vw; dh = Math.floor(dw / ratio); }
		if (dh > vh) { dh = vh; dw = Math.floor(dh * ratio); }
		c.style.width = dw + 'px';
		c.style.height = dh + 'px';

		return true;
	}

	function poll() {
		attempts++;
		var done = fixCanvas();
		if (!done && attempts < maxAttempts) {
			setTimeout(poll, 200);
		}
	}

	// Start polling after a short delay for the game engine to init
	setTimeout(poll, 100);

	// Also re-fix after resize (game's onresize may overwrite)
	window.addEventListener('resize', function() {
		attempts = 0;
		setTimeout(poll, 100);
	});
})();
</script>

</body>
</html>
