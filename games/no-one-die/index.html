<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一个都不能死</title>

<style type="text/css">
html, body {
	margin: 0;
	padding: 0;
	overflow: hidden;
	width: 100%;
	height: 100%;
	background: #000;
	display: flex;
	align-items: center;
	justify-content: center;
}
.game-stage {
	position: relative;
	width: 100%;
	height: 100%;
	max-width: 100vw;
	max-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	overflow: hidden;
}
.game-stage canvas {
	display: block;
	max-width: 100%;
	max-height: 100%;
	aspect-ratio: 1366 / 621;
}
</style>

<script type="text/javascript" src="js/require.js"></script>
<script type="text/javascript" src="js/main.js"></script>

</head>
<body>

<div class="game-stage">
	<canvas id="linkScreen" width="1366" height="621">
		很遗憾，您的浏览器不支持HTML5，请使用支持HTML5的浏览器。
	</canvas>
</div>

<script>
// Fix canvas dimensions for dual-lane rendering (needs ≥640px height)
// Game loads async via require.js and overwrites canvas during init.
// Setting canvas.width/height clears the buffer (causes flicker), so we:
//   - Only set buffer when actually wrong (guarded by ratio check)
//   - Always set CSS display size (safe, no flicker)
//   - Use staged timeouts + onresize interceptor instead of aggressive interval
(function() {
	var MIN_H = 640;
	var RATIO = 1366 / 621;

	function getFixedBufferSize() {
		return { w: Math.floor(MIN_H * RATIO), h: MIN_H };
	}

	function fixCanvas() {
		var c = document.getElementById('linkScreen');
		if (!c || !c.getContext) return;

		// 1. Fix buffer ONLY when game engine overwrote it (avoids flicker from clear)
		var curRatio = c.width / c.height;
		var offRatio = Math.abs(curRatio - RATIO) > 0.01;
		var tooShort = c.height < MIN_H;
		if (offRatio || tooShort) {
			var bs = getFixedBufferSize();
			c.width = bs.w;
			c.height = bs.h;
		}

		// 2. Always fix CSS display size (safe — no buffer clear)
		var vw = window.innerWidth;
		var vh = window.innerHeight;
		var bs = getFixedBufferSize();
		var dw = bs.w, dh = bs.h;
		if (dw > vw) { dw = vw; dh = Math.floor(dw / RATIO); }
		if (dh > vh) { dh = vh; dw = Math.floor(dh * RATIO); }
		c.style.width = dw + 'px';
		c.style.height = dh + 'px';
	}

	// Intercept window.onresize so fixCanvas runs after every game-engine resize
	var _origResize = null;
	Object.defineProperty(window, 'onresize', {
		configurable: true,
		enumerable: true,
		get: function() { return _origResize; },
		set: function(fn) {
			_origResize = function() {
				if (fn) fn.apply(this, arguments);
				setTimeout(fixCanvas, 0);
			};
		}
	});
	// Apply if game engine already set onresize before our interceptor
	var _saved = window.onresize;
	window.onresize = _saved;

	// Staged polls at increasing intervals (game loads async, we don't know when)
	[100, 300, 600, 1000, 1500, 2000, 3000, 5000, 8000, 12000, 20000].forEach(function(d) {
		setTimeout(fixCanvas, d);
	});

	// Real browser resize
	window.addEventListener('resize', function() {
		setTimeout(fixCanvas, 50);
	});
})();
</script>

</body>
</html>
