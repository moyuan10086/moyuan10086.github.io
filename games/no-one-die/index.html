<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一个都不能死</title>

<style type="text/css">
html, body {
	margin: 0;
	padding: 0;
	overflow: hidden;
	width: 100%;
	height: 100%;
	background: #000;
	display: flex;
	align-items: center;
	justify-content: center;
}
.game-wrapper {
	width: 100%;
	max-width: 100%;
	aspect-ratio: 1366 / 880;
	overflow: hidden;
	position: relative;
}
.game-wrapper canvas {
	display: block;
	width: 100%;
	height: 100%;
}
</style>

<script type="text/javascript" src="js/require.js"></script>
<script type="text/javascript" src="js/main.js"></script>
</head>
<body>

<div class="game-wrapper" id="gameWrapper">
	<canvas id="linkScreen" width="1366" height="880">
		很遗憾，您的浏览器不支持HTML5，请使用支持HTML5的浏览器。
	</canvas>
</div>

<script>
(function() {
	var wrapper = document.getElementById('gameWrapper');
	var canvas = document.getElementById('linkScreen');
	var widthDesc = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
	var heightDesc = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
	var fs = false;

	window.addEventListener('message', function(e) {
		if (e.data && e.data.type === 'fullscreen') {
			fs = e.data.value;
			if (!fs && window.onresize) setTimeout(function() { window.onresize(); }, 50);
		}
	});

	Object.defineProperty(canvas, 'width', {
		get: function() { return widthDesc.get.call(this); },
		set: function(v) { widthDesc.set.call(this, fs ? v : wrapper.clientWidth || 1366); },
		configurable: true
	});
	Object.defineProperty(canvas, 'height', {
		get: function() { return heightDesc.get.call(this); },
		set: function(v) { heightDesc.set.call(this, fs ? v : wrapper.clientHeight || 880); },
		configurable: true
	});
})();
</script>
</body>
</html>
