<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一个都不能死</title>

<style type="text/css">
html, body {
	margin: 0;
	padding: 0;
	overflow: hidden;
	width: 100%;
	height: 100%;
	background: #000;
	display: flex;
	align-items: center;
	justify-content: center;
}
.scale-wrap {
	width: 1366px;
	height: 621px;
	transform-origin: center center;
	overflow: hidden;
}
.scale-wrap canvas {
	display: block;
	width: 1366px;
	height: 621px;
}
</style>

<script type="text/javascript" src="js/require.js"></script>
<script type="text/javascript" src="js/main.js"></script>

</head>
<body>

<div class="scale-wrap">
	<canvas id="linkScreen" width="1366" height="621">
		很遗憾，您的浏览器不支持HTML5，请使用支持HTML5的浏览器。
	</canvas>
</div>

<script>
// Scale the wrapper to fit viewport. Canvas inside is untouched — no flicker.
(function() {
	var NATIVE_W = 1366;
	var NATIVE_H = 621;
	var wrap = document.querySelector('.scale-wrap');

	function rescale() {
		var vw = window.innerWidth;
		var vh = window.innerHeight;
		var s = Math.min(vw / NATIVE_W, vh / NATIVE_H, 1);
		wrap.style.transform = 'scale(' + s + ')';
		// Fix canvas style in case game engine overwrites it
		var c = document.getElementById('linkScreen');
		if (c) { c.style.width = NATIVE_W + 'px'; c.style.height = NATIVE_H + 'px'; }
	}

	rescale();
	window.addEventListener('resize', function() {
		setTimeout(rescale, 50);
	});

	// Delayed re-fix for after game engine async init
	[300, 800, 1500, 3000].forEach(function(d) {
		setTimeout(rescale, d);
	});
})();
</script>

</body>
</html>
