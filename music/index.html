  var audio = document.getElementById('music-audio');
  var title = document.getElementById('track-title');
  var artist = document.getElementById('track-artist');
  var cover = document.getElementById('music-cover');
  var disc = document.getElementById('music-disc');
  var playlist = document.getElementById('playlist');
  var playlistCount = document.getElementById('playlist-count');
  var playlistSearch = document.getElementById('playlist-search');
  var playBtn = document.getElementById('play-btn');
  var discToggle = document.getElementById('disc-toggle');
  var miniPlay = document.getElementById('mini-play');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  var muteBtn = document.getElementById('mute-btn');
  var loopBtn = document.getElementById('loop-btn');
  var shuffleBtn = document.getElementById('shuffle-btn');
  var progress = document.getElementById('progress');
  var played = document.getElementById('progress-played');
  var loaded = document.getElementById('progress-loaded');
  var thumb = document.getElementById('progress-thumb');
  var currentTime = document.getElementById('current-time');
  var duration = document.getElementById('duration');
  var lyricLine = document.getElementById('lyric-line');
  var subtitle = document.getElementById('track-subtitle');
  var index = 0;
  var shuffle = false;
  var loop = true;
  var lyrics = [];
  var isSeeking = false;
  var isAudioReady = false;
  var loadToken = 0;
  var audioCache = {};
  var isPlaying = false;
  var pendingAutoplay = false;
  var rafId = 0;
  var filteredTracks = musicTracks.slice();

  function assetUrl(file) {
    if (!file) return '';
    if (file.startsWith('/') || file.startsWith('http://') || file.startsWith('https://')) {
      return file;
    }
    return '/music/songs/' + encodeURIComponent(file).replace(/%2F/g, '/');
  }

  function formatTime(value) {
    if (!Number.isFinite(value)) return '00:00';
    var min = Math.floor(value / 60);
    var sec = Math.floor(value % 60);
    return String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }

  function icon(name) {
    return '<i class="fas fa-' + name + '"></i>';
  }

  function renderPlaylist() {
    playlist.innerHTML = '';
    playlistCount.textContent = filteredTracks.length + ' 首';

    if (filteredTracks.length === 0) {
      playlist.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--music-muted); font-size: 13px;">无匹配歌曲</div>';
      return;
    }

    filteredTracks.forEach(function (track) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.trackId = track.index - 1;
      if (track.index - 1 === index) btn.classList.add('is-active');

      var isLocal = !!track.file;
      var badgeHtml = isLocal
        ? '<span class="track-badge badge-local"><i class="fas fa-check-circle"></i> 本地</span>'
        : '<span class="track-badge badge-cloud"><i class="fas fa-cloud"></i> 云端</span>';

      btn.innerHTML =
        '<span class="track-num">' + String(track.index).padStart(3, '0') + '</span>' +
        '<div class="track-meta">' +
          '<span class="track-name">' + track.name + '</span>' +
          '<span class="track-artist">' + track.artist + (track.album ? ' · ' + track.album : '') + '</span>' +
        '</div>' +
        '<span class="track-duration">' + (track.interval || '--:--') + '</span>' + badgeHtml;

      btn.addEventListener('click', function () {
        loadTrack(Number(btn.dataset.trackId), true);
      });

      playlist.appendChild(btn);
    });
  }

  function filterPlaylist() {
    var kw = playlistSearch ? playlistSearch.value.trim().toLowerCase() : '';
    if (!kw) {
      filteredTracks = musicTracks.slice();
    } else {
      filteredTracks = musicTracks.filter(function (t) {
        return (t.name.toLowerCase().indexOf(kw) > -1) ||
               (t.artist.toLowerCase().indexOf(kw) > -1) ||
               (t.album && t.album.toLowerCase().indexOf(kw) > -1);
      });
    }
    renderPlaylist();
  }

  if (playlistSearch) {
    playlistSearch.addEventListener('input', filterPlaylist);
  }

  function updateActive() {
    Array.prototype.forEach.call(playlist.querySelectorAll('button'), function (btn) {
      btn.classList.toggle('is-active', Number(btn.dataset.trackId) === index);
    });
  }

  function parseLyrics(text) {
    if (!text) return [];
    var lines = text.split(/\r?\n/);
    var result = [];

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;

      var match = line.match(/^\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\](.*)/);
      if (match) {
        var min = Number(match[1]);
        var sec = Number(match[2]);
        var ms = Number('0.' + (match[3] || '0'));
        var txt = match[4].trim();
        if (txt && !/^(ti|ar|al|by|offset|sign|qq|total):/i.test(txt)) {
          result.push({
            time: min * 60 + sec + ms,
            text: txt
          });
        }
      } else if (!line.startsWith('[')) {
        result.push({
          time: i * 4,
          text: line
        });
      }
    }
    result.sort(function (a, b) { return a.time - b.time; });
    return result;
  }

  function loadLyrics(track) {
    lyrics = [];
    lyricLine.textContent = '歌词载入中...';
    var lrcUrl = track.lrc || ('/music/lyrics/track-' + String(track.index).padStart(3, '0') + '.lrc');

    fetch(assetUrl(lrcUrl))
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (text) {
        lyrics = parseLyrics(text);
        if (lyrics.length > 0) {
          lyricLine.textContent = lyrics[0].text;
        } else {
          lyricLine.textContent = '♪ 纯音乐 / 暂无歌词 ♪';
        }
      })
      .catch(function () {
        lyricLine.textContent = '♪ ' + track.name + ' · ' + track.artist + ' ♪';
      });
  }

  function setPlayingUI(isPlaying) {
    var playIcon = isPlaying ? 'pause' : 'play';
    playBtn.innerHTML = icon(playIcon);
    discToggle.innerHTML = icon(playIcon);
    miniPlay.innerHTML = icon(isPlaying ? 'pause' : 'music');
    disc.classList.toggle('is-playing', isPlaying);
  }

  function getPosition() {
    return audio.currentTime || 0;
  }

  function scheduleProgress() {
    if (rafId) cancelAnimationFrame(rafId);
    function tick() {
      var position = getPosition();
      currentTime.textContent = formatTime(position);
      if (audio.duration && !isSeeking) setProgressPercent(position / audio.duration * 100);
      updateLyric();
      if (!audio.paused) rafId = requestAnimationFrame(tick);
    }
    rafId = requestAnimationFrame(tick);
  }

  function resetProgress() {
    isPlaying = false;
    pendingAutoplay = false;
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    played.style.width = '0%';
    loaded.style.width = '0%';
    thumb.style.left = '0%';
    currentTime.textContent = '00:00';
    duration.textContent = '00:00';
  }

  function playAudio() {
    pendingAutoplay = false;
    if (!isAudioReady || !audio.src) {
      pendingAutoplay = true;
      subtitle.textContent = '正在准备播放...';
      return;
    }
    var playPromise = audio.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(function (error) {
        pendingAutoplay = error && error.name === 'NotAllowedError';
        isPlaying = false;
        if (pendingAutoplay) subtitle.textContent = '点击页面后开始播放';
        setPlayingUI(false);
      });
    }
  }

  function applyAudioSource(src, autoplay) {
    pendingAutoplay = !!autoplay;
    audio.src = src;
    audio.load();
  }

  function pauseAudio() {
    pendingAutoplay = false;
    audio.pause();
  }

  var audioFailed = false;
  var resolveController;
  function setAudioLoadFailed() {
    audioFailed = true;
    delete audioCache['lx_song_' + musicTracks[index].index];
    isAudioReady = false;
    pendingAutoplay = false;
    isPlaying = false;
    subtitle.textContent = '音源暂时不可用，点击播放重试，或选择标有本地的歌曲。';
    setPlayingUI(false);

  }

  function resolveCloudUrl(track) {
    var cacheKey = 'lx_song_' + track.index;
    if (audioCache[cacheKey]) {
      return Promise.resolve({ url: audioCache[cacheKey], pic: null });
    }
    var kw = encodeURIComponent(track.name + ' ' + track.artist);
    var url = 'https://oiapi.net/api/Kuwo?msg=' + kw + '&n=1&br=1';

    return fetch(url)
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var songUrl = data && data.data && data.data.url;
        if (!songUrl) throw new Error('No song URL in API response');
        // Ensure https
        songUrl = songUrl.replace(/^http:\/\//i, 'https://');
        audioCache[cacheKey] = songUrl;
        return { url: songUrl, pic: data.data.picture };
      });
  }

  function loadAudio(trackIndex, token, autoplay) {
    var track = musicTracks[trackIndex];
    isAudioReady = false;
    audio.removeAttribute('src');
    audio.load();

    if (token !== loadToken) return;

    if (track.file) {
      subtitle.textContent = '正在载入本地母带音源...';
      var localUrl = assetUrl(track.file);
      applyAudioSource(localUrl, autoplay);
    } else {
      subtitle.textContent = '正在获取云端音源…';
      resolveCloudUrl(track)
        .then(function (res) {
          if (token !== loadToken) return;
          if (res.pic && cover) cover.src = res.pic;
          applyAudioSource(res.url, autoplay);
        })
        .catch(function (err) {
          if (token !== loadToken) return;
          setAudioLoadFailed();
        });
    }
  }

  function loadTrack(nextIndex, autoplay) {
    audioFailed = false;
    if (resolveController) resolveController.abort();
    loadToken += 1;
    index = (nextIndex + musicTracks.length) % musicTracks.length;
    var track = musicTracks[index];
    title.textContent = track.name;
    artist.textContent = track.artist + (track.album ? ' (' + track.album + ')' : '');
    cover.src = track.cover;
    resetProgress();
    setPlayingUI(false);
    updateActive();
    loadLyrics(track);
    loadAudio(index, loadToken, autoplay);
  }

  function togglePlay() {
    if (audioFailed) { loadTrack(index, true); return; }
    if (!isAudioReady) {
      pendingAutoplay = true;
      subtitle.textContent = '正在缓冲音频...';
      return;
    }
    if (isPlaying) pauseAudio();
    else playAudio();
  }

  function finishAudioReady() {
    if (isAudioReady) return;
    isAudioReady = true;
    duration.textContent = formatTime(audio.duration);
    loaded.style.width = '100%';
    subtitle.textContent = '今天的歌单已就绪 (' + (index + 1) + '/' + musicTracks.length + ')';
    if (pendingAutoplay) playAudio();
  }

  function nextTrack() {
    var next = shuffle ? Math.floor(Math.random() * musicTracks.length) : index + 1;
    if (next === index) next = (index + 1) % musicTracks.length;
    loadTrack(next, true);
  }

  function prevTrack() {
    var prev = shuffle ? Math.floor(Math.random() * musicTracks.length) : index - 1;
    if (prev === index) prev = (index - 1 + musicTracks.length) % musicTracks.length;
    loadTrack(prev, true);
  }

  function updateLyric() {
    if (!lyrics.length) return;
    var active = lyrics[0];
    var position = getPosition();
    for (var i = 0; i < lyrics.length; i++) {
      if (lyrics[i].time <= position) active = lyrics[i];
      else break;
    }
    if (active && lyricLine.textContent !== active.text) lyricLine.textContent = active.text;
  }

  function setProgressPercent(percent) {
    var value = Math.max(0, Math.min(100, percent));
    played.style.width = value + '%';
    thumb.style.left = value + '%';
  }

  function seekFromEvent(event) {
    if (!isAudioReady || !audio.duration) return;
    var rect = progress.getBoundingClientRect();
    var clientX = event.clientX;
    var percent = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    var targetTime = percent * audio.duration;
    audio.currentTime = targetTime;
    setProgressPercent(percent * 100);
    currentTime.textContent = formatTime(targetTime);
    updateLyric();
  }

  renderPlaylist();
  var resumeMusic = null;
  try { resumeMusic = JSON.parse(sessionStorage.getItem('moyuan-music-state-v1') || 'null'); } catch (_) {}
  if (resumeMusic && Number.isInteger(resumeMusic.id) && musicTracks[resumeMusic.id]) {
    audio.volume = Math.max(0, Math.min(1, Number(resumeMusic.volume ?? 0.45)));
    audio.addEventListener('loadedmetadata', function restorePosition() {
      if (Number.isFinite(audio.duration)) audio.currentTime = Math.min(Number(resumeMusic.time) || 0, audio.duration);
    }, { once: true });
    loadTrack(resumeMusic.id, !!resumeMusic.playing);
  } else {
    loadTrack(0, false);
  }

  [playBtn, discToggle, miniPlay].forEach(function (button) {
    button.addEventListener('click', togglePlay);
  });
  prevBtn.addEventListener('click', prevTrack);
  nextBtn.addEventListener('click', nextTrack);
  muteBtn.addEventListener('click', function () {
    audio.muted = !audio.muted;
    muteBtn.innerHTML = icon(audio.muted ? 'volume-mute' : 'volume-up');
  });
  loopBtn.addEventListener('click', function () {
    loop = !loop;
    loopBtn.style.opacity = loop ? '1' : '0.45';
  });
  shuffleBtn.addEventListener('click', function () {
    shuffle = !shuffle;
    shuffleBtn.style.opacity = shuffle ? '1' : '0.45';
  });
  function handleSeekMove(event) {
    if (!isSeeking) return;
    event.preventDefault();
    seekFromEvent(event);
  }

  function handleSeekEnd(event) {
    if (!isSeeking) return;
    event.preventDefault();
    seekFromEvent(event);
    isSeeking = false;
    window.removeEventListener('pointermove', handleSeekMove);
    window.removeEventListener('pointerup', handleSeekEnd);
    window.removeEventListener('pointercancel', handleSeekCancel);
  }

  function handleSeekCancel() {
    isSeeking = false;
    window.removeEventListener('pointermove', handleSeekMove);
    window.removeEventListener('pointerup', handleSeekEnd);
    window.removeEventListener('pointercancel', handleSeekCancel);
  }

  progress.addEventListener('pointerdown', function (event) {
    if (!isAudioReady || !audio.duration) return;
    event.preventDefault();
    isSeeking = true;
    seekFromEvent(event);
    window.addEventListener('pointermove', handleSeekMove);
    window.addEventListener('pointerup', handleSeekEnd);
    window.addEventListener('pointercancel', handleSeekCancel);
  });

  audio.addEventListener('canplay', finishAudioReady);
  audio.addEventListener('durationchange', function () {
    if (Number.isFinite(audio.duration)) finishAudioReady();
  });
  document.addEventListener('pointerdown', function () {
    if (pendingAutoplay && isAudioReady && audio.paused) playAudio();
  });
  document.addEventListener('keydown', function () {
    if (pendingAutoplay && isAudioReady && audio.paused) playAudio();
  });
  audio.addEventListener('play', function () {
    isPlaying = true;
    setPlayingUI(true);
    scheduleProgress();
  });
  audio.addEventListener('pause', function () {
    isPlaying = false;
    setPlayingUI(false);
  });
  audio.addEventListener('timeupdate', function () {
    currentTime.textContent = formatTime(audio.currentTime);
    if (audio.duration && !isSeeking) setProgressPercent(audio.currentTime / audio.duration * 100);
    updateLyric();
  });
  audio.addEventListener('ended', function () {
    isPlaying = false;
    if (loop) nextTrack();
    else setPlayingUI(false);
  });
  audio.addEventListener('error', setAudioLoadFailed);
  document.getElementById('playlist-toggle').addEventListener('click', function () {
    document.getElementById('playlist-wrap').scrollIntoView({block:'start', behavior:'smooth'});
    playlistSearch.focus({preventScroll:true});
  });
  progress.setAttribute('role','slider');
  progress.setAttribute('tabindex','0');
  progress.setAttribute('aria-label','播放进度');
  progress.setAttribute('aria-valuemin','0');
  progress.setAttribute('aria-valuemax','100');
  progress.setAttribute('aria-valuenow','0');
  progress.addEventListener('keydown', function (event) {
    if (!Number.isFinite(audio.duration)) return;
    if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
      event.preventDefault();
      audio.currentTime = Math.max(0,Math.min(audio.duration,audio.currentTime + (event.key === 'ArrowRight' ? 5 : -5)));
    }
  });
  audio.addEventListener('timeupdate', function () {
    progress.setAttribute('aria-valuenow', String(Math.round((audio.currentTime / audio.duration || 0) * 100)));
  });
  window.addEventListener('pagehide', function () {
    window.__musicPageLeaving = true;
    if (audio.readyState > 0) {
      try { sessionStorage.setItem('moyuan-music-state-v1', JSON.stringify({id:index,time:audio.currentTime,playing:!audio.paused,volume:audio.volume})); } catch (_) {}
    }
    if (resolveController) resolveController.abort();
    pendingAutoplay = false; audio.pause(); handleSeekCancel();
  });
  window.addEventListener('pageshow', function () { window.__musicPageLeaving = false; });

})();
